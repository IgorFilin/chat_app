<div class="ng-header">
  <div class="ng-headerContainer">
    <div class="ng-header__icons">
      @if (isAuth) {
        <cabinet-icon
          (iconClick)="onIconHomeClickHandler()"
          [id]="'home'"
          [color]="'white'" />
        }
        <label class="toggle">
          <input
            [checked]="checked"
            (input)="onCheckHandler($event)"
            id="toggle"
            type="checkbox"
          />
          <span for="toggle" class="toggle__radius"></span>
        </label>
    </div>
    @if (isAuth && currentRoute === '/knowledgeBase') {
    <div class="ng-header__searchInputContainer">
      <app-search-input
        placeholder="Поиск статьи"
        errorMessage="Обязательное поле"
        [searchedRequest]="onSearchArticles"
      />
    </div>
    @if(searchedArticles.length) {
      <div class="ng-header__searchedArticles">
        @for(article of searchedArticles; track $index) {
            <div>{{article.title}}</div>
        }
      </div>
    }
    <button (click)="onClickLeaveHandler()" class="ng-header__button">
      Выход
    </button>
    }
  </div>
</div>
