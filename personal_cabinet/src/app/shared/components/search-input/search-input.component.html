<div class="search-input">
  <div class="ng-input">
    <input
      type="text"
      [value]="value"
      (input)="onChangeHandler($event)"
      (blur)="handleBlur()"
      type="text"
      placeholder=" "
    />
    <label [attr.placeholder]="placeholder">{{ placeholder }}</label>
  </div>
  <app-form-error-handler [showError]="showError" [errorMessage]="errorMessage" />
  @if (isLoadingData){
    <div class="search-input__loaderContainer">
      <div class="loader-spinner"></div>
    </div>
  } @else {
  
  }
</div>
